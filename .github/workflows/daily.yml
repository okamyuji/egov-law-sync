name: daily
on:
  schedule:
    - cron: "7 22 * * *"
  workflow_dispatch:
    inputs:
      from: { description: "YYYY-MM-DD", required: false }
      to: { description: "YYYY-MM-DD", required: false }
      force: { description: "trueで閾値判定を無視", required: false, default: "false" }
permissions:
  contents: write
  issues: write
concurrency:
  group: manifest
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      FROM: ${{ inputs.from }}
      TO: ${{ inputs.to }}
      FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - id: labels
        run: |
          gh label create anomaly --force --color B60205
          gh label create warning --force --color FBCA04
      - id: tag
        run: |
          tag=$(bash tools/next-version.sh)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: make build
      - id: run
        run: |
          set +e
          args=(daily --release-tag "${{ steps.tag.outputs.tag }}" --xml-dir bin/xml)
          [ -n "$FROM" ] && args+=(--from "$FROM")
          [ -n "$TO" ] && args+=(--to "$TO")
          [ "$FORCE" = "true" ] && args+=(--force)
          touch bin/run-start
          bin/egov-law-sync "${args[@]}"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: release
        if: steps.run.outputs.code == '0'
        run: |
          assets=()
          [ -f bin/laws-xml.zip ] && assets+=(bin/laws-xml.zip)
          [ -f bin/laws-text.zip ] && assets+=(bin/laws-text.zip)
          if [ "${#assets[@]}" -gt 0 ]; then
            gh release create "${{ steps.tag.outputs.tag }}" "${assets[@]}" --title "${{ steps.tag.outputs.tag }} daily $(TZ=Asia/Tokyo date +%F)" --notes "出典: e-Gov法令検索（デジタル庁）。laws-xml.zipは取得したXML、laws-text.zipは同じ法令のMarkdownと条単位のJSONLです。"
          fi
      - name: commit
        if: steps.run.outputs.code == '0' || steps.run.outputs.code == '3'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.run.outputs.code }}" = "3" ]; then git add manifest/runs; else git add manifest; fi
          git commit -m "chore(sync): daily $(date -u +%F) (exit ${{ steps.run.outputs.code }})" || exit 0
          # 実行中にmainへ別のcommitが入っても失敗しないよう、manifestの変更を最新のmainに載せ直す
          git pull --rebase origin main
          git push
      - name: issue
        if: ${{ !cancelled() && steps.labels.outcome == 'success' }}
        run: bash tools/issue.sh "${{ steps.run.outputs.code }}" manifest/runs/daily "${{ job.status }}"
      - name: fail on unexpected exit code
        if: ${{ !cancelled() && steps.run.outputs.code != '0' && steps.run.outputs.code != '3' }}
        run: exit 1
