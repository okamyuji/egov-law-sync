name: weekly
on:
  schedule:
    - cron: "0 23 * * 6"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: manifest
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - id: labels
        run: |
          gh label create anomaly --force --color B60205
          gh label create warning --force --color FBCA04
      - id: tag
        run: |
          tag=$(bash tools/next-version.sh)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: make build
      - id: run
        run: |
          set +e
          touch bin/run-start
          bin/egov-law-sync weekly --release-tag "${{ steps.tag.outputs.tag }}" --xml-dir bin/xml
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: release
        if: steps.run.outputs.code == '0'
        run: |
          assets=()
          [ -f bin/laws-xml.zip ] && assets+=(bin/laws-xml.zip)
          [ -f bin/laws-text.zip ] && assets+=(bin/laws-text.zip)
          if [ "${#assets[@]}" -gt 0 ]; then
            gh release create "${{ steps.tag.outputs.tag }}" "${assets[@]}" --title "${{ steps.tag.outputs.tag }} weekly $(TZ=Asia/Tokyo date +%F)" --notes "出典: e-Gov法令検索（デジタル庁）。laws-xml.zipは取得したXML、laws-text.zipは同じ法令のMarkdownと条単位のJSONLです。"
          fi
      - name: commit
        if: steps.run.outputs.code == '0' || steps.run.outputs.code == '3'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.run.outputs.code }}" = "3" ]; then git add manifest/runs; else git add manifest; fi
          git commit -m "chore(sync): weekly $(date -u +%F) (exit ${{ steps.run.outputs.code }})" || exit 0
          git push
      - name: issue
        if: ${{ !cancelled() && steps.labels.outcome == 'success' }}
        run: bash tools/issue.sh "${{ steps.run.outputs.code }}" manifest/runs/weekly "${{ job.status }}"
      - name: fail on unexpected exit code
        if: ${{ !cancelled() && steps.run.outputs.code != '0' && steps.run.outputs.code != '3' }}
        run: exit 1
