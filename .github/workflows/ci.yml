name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    permissions:
      contents: read
      pull-requests: write
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@v1

  doclint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make doclint

  ci:
    uses: okamyuji/reusable-workflows/.github/workflows/go-ci.yml@v1
    with:
      test-command: make test

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - run: go install github.com/gitleaks/gitleaks/v8@v8.30.1
      - run: make quality

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          if [ "$(wc -l < VERSION)" != 1 ] || ! grep -Eq '^[0-9]+\.[0-9]+$' VERSION; then
            echo "VERSION must be one MAJOR.MINOR line"
            exit 1
          fi
