name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    permissions:
      contents: read
      pull-requests: write
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@v1

  doclint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make doclint

  ci:
    uses: okamyuji/reusable-workflows/.github/workflows/go-ci.yml@v1
    with:
      test-command: make test

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make crap
      - run: make mutate
      - run: make e2e

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: grep -Eq '^[0-9]+\.[0-9]+$' VERSION || { echo "VERSION must be MAJOR.MINOR"; exit 1; }
